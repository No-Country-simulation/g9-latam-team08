server.port=${SERVER_PORT:8080}
spring.application.name=finance-dashboard-api

# Perfil activo (usar 'prod' para producción con MySQL Railway)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Database Configuration (default: H2 en memoria para desarrollo)
spring.datasource.url=${DB_URL:jdbc:h2:mem:financedb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate Configuration
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.root=INFO
logging.level.com.financeai=DEBUG

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# CORS Configuration
server.servlet.context-path=/api

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ML Microservice (Python Flask)
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}

