# ═══════════════════════════════════════════════════════════════════
# PRODUCCIÓN — MySQL en Railway + despliegue en OCI
# Activar con: --spring.profiles.active=prod
#
# Las credenciales se pasan por variables de entorno:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# ═══════════════════════════════════════════════════════════════════

# Database — Railway MySQL (credenciales via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA/Hibernate — MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Desactivar H2 Console en producción
spring.h2.console.enabled=false

# Server
server.address=0.0.0.0
