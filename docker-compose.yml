services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/financedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: finance
      SPRING_DATASOURCE_PASSWORD: finance_password
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:5000}
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    restart: unless-stopped

  ml-service:
    build:
      context: ./backend/ml
      dockerfile: Dockerfile
    environment:
      OCI_BASE_URL: ${OCI_BASE_URL:?Configura OCI_BASE_URL en el archivo .env con la URL del PAR de OCI}
      OCI_ARTEFACTOS_PATH: ${OCI_ARTEFACTOS_PATH:-clasificacion-gastos/artefactos_categoria.pkl}
      OCI_MODELO_CATEGORIA_PATH: ${OCI_MODELO_CATEGORIA_PATH:-clasificacion-gastos/modelo_categoria_full.keras}
      OCI_MODELO_RIESGO_PATH: ${OCI_MODELO_RIESGO_PATH:-clasificacion-perfil/modelo_riesgo_financiero.pkl}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: financedb
      MYSQL_USER: finance
      MYSQL_PASSWORD: finance_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
